<div class="op-kpis">
  <div class="kpi-card"><div class="kl">Abertas</div><div class="kv">{{ abertas }}</div></div>
  <div class="kpi-card"><div class="kl">Executando</div><div class="kv">{{ executando }}</div></div>
  <div class="kpi-card"><div class="kl">Executado</div><div class="kv">{{ executado }}</div></div>
  <div class="kpi-card kpi-warn"><div class="kl">⚠ Pendentes</div><div class="kv">{{ pendentes }}</div></div>
  <div class="kpi-card"><div class="kl">Finalizadas</div><div class="kv">{{ finalizadas }}</div></div>
  <div class="kpi-card kpi-warn"><div class="kl">Vencendo 24h</div><div class="kv">{{ vencendo }}</div></div>
  <div class="kpi-card kpi-danger"><div class="kl">Atrasadas</div><div class="kv">{{ atrasadas }}</div></div>
</div>
<div class="op-updated">Atualizado: {{ now|date:"H:i:s" }}</div>
